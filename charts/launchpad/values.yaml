apolo_app_id: ""  # passed as an input
dbPassword: null
dbSecretName: launchpad-db-secret  # in real app will be f"launchpad-{apolo_app_id}-db-secret"
keycloakRealmImportConfigMapName: launchpad-keycloak-realm  # in real app will be f"launchpad-{apolo_app_id}-keycloak-realm"

isolatedDatabases:
  enabled: false
  image: docker.io/library/postgres:17.12-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
  storage: 8Gi
  names: {}
  passwords: {}

# Used by Launchpad when both bundled PostgreSQL options are disabled.
externalDatabase:
  # Secret keys are DB_HOST, DB_PORT, DB_NAME, DB_USER and DB_PASSWORD.
  existingSecret: ""

image:
  repository: "ghcr.io/neuro-inc/launchpad"
  tag: "latest"
  digest: ""

replicas: 1
port: 8080

# passed to lauchpad API deployment
extraEnv: {}

domain: "apps.dev.apolo.us"
clientSubdomain: false  # when true, client is served at {name}.launchpad.{domain} instead of {name}.{domain}
netlifyDomain: "launchpad-web-ui-dev-apolo-us.netlify.app"
netlifySecretName: launchpad-secrets

# TODO(IT-281): Remove Netlify fallback after every installed App uses a verified frontend release.
frontend:
  image:
    repository: ghcr.io/neuro-inc/launchpad-web-ui
    digest: ""
  sessionSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# apolo specific values
APOLO_PASSED_CONFIG: null
preset_name: cpu-medium
# apolo_app_id: app-id-12345
labels:
  application: launchpad

# branding - files mounted from Apolo storage
# Logo/favicon provided as ApoloFilesImagePath by user
# Platform handles mounting via labels/annotations
branding: {}

# Populated by the app install preprocessor with headers owned by Launchpad auth.
authResponseHeaders: null


podLabels: {}
podAnnotations: {}

# LAUNCHPAD_ADMIN_PASSWORD: null  # should be set to a secure value in real app

# application specific values example
LAUNCHPAD_INITIAL_CONFIG: >
  {
      "vllm": {
          "hugging_face_model": {
              "model_hf_name": "microsoft/DialoGPT-medium",
              "hf_token": null
          },
          "preset": {
              "name": "gpu-large"
          },
          "server_extra_args": [
              "--max-model-len=2048",
              "--gpu-memory-utilization=0.9"
          ]
      },
      "postgres": {
          "preset": {
              "name": "cpu-small"
          },
          "pg_bouncer": {
              "preset": {
                  "name": "cpu-small"
              }
          }
      },
      "text-embeddings": {
          "model": {
              "model_hf_name": "BAAI/bge-m3",
              "hf_token": null
          },
          "preset": {
              "name": "gpu-small"
          },
          "server_extra_args": []
      }
  }

# Comma-separated auth bypass path prefixes.
# Empty string disables bypass entirely.
LAUNCHPAD_AUTH_BYPASS_PATH_PREFIXES: "/public,/api/webhooks"

# The Apolo installer enables the shared database for legacy installations.
postgresql:
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamilegacy/postgresql
    tag: 17.5.0-debian-12-r18
  enabled: false
  fullnameOverride: launchpad-db  # in real app will be f"launchpad-{apolo_app_id}-db"
  commonAnnotations:
    argocd.argoproj.io/sync-wave: "0"
  auth:
    existingSecret: launchpad-db-secret  # # in real app will be f"launchpad-{apolo_app_id}-db-secret"
    username: postgres
    database: postgres
    password: ""   # not used for admin (use existingSecret)
    secretKeys:
      adminPasswordKey: "DB_PASSWORD"
      userPasswordKey: "DB_PASSWORD"
  primary:
    initdb:
      scripts:
        create_dbs.sql: |
          CREATE DATABASE keycloak;
          CREATE DATABASE launchpad;
    tolerations:
      - effect: NoSchedule
        key: platform.neuromation.io/job
        operator: Exists
      - effect: NoExecute
        key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        tolerationSeconds: 300
      - effect: NoExecute
        key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        tolerationSeconds: 300
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: platform.neuromation.io/job
                  operator: In
                  values:
                    - "true"

# Unset preserves existing provider settings. False restores the managed binding.
procoreAutomaticLinking: null
procoreProvider: null

keycloak:
  image:
    repository: quay.io/keycloak/keycloak
    tag: 26.8.2-3
    digest: sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
  defaultRealm: "launchpad" # internal variable
  fullnameOverride: launchpad-keycloak  # in real app will be f"launchpad-{apolo_app_id}-keycloak"
  replicaCount: 1
  auth:
    adminUser: "admin"
    adminPassword: ""  # Set by the Apolo installer, or supply auth.existingSecret.
    existingSecret: ""
  externalDatabase:
    user: "postgres"
    database: "keycloak"
    port: 5432
    existingSecret: "" # Required when using an external database.
    existingSecretHostKey: "DB_HOST"
    existingSecretPasswordKey: "DB_PASSWORD"
  service:
    ports:
      http: 80
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 50Mi
    limits:
      cpu: 750m
      memory: 768Mi
      ephemeral-storage: 2Gi
  tolerations:
    - effect: NoSchedule
      key: platform.neuromation.io/job
      operator: Exists
  initContainers:
    - name: fetch-theme
      image: alpine/git:2.45.2
      imagePullPolicy: IfNotPresent
      command: [ "/bin/sh","-lc" ]
      # Keep the theme mount in sync with the installer in inputs_processor.py.
      args:
        - |
          set -eu
          if [ -n "$APOLO_APP_GIT_REPO" ] && [ -n "$APOLO_APP_GIT_REVISION" ]; then
            git clone --depth 1 --branch "$APOLO_APP_GIT_REVISION" "$APOLO_APP_GIT_REPO" /tmp/repo
            THEME_SRC="/tmp/repo/kc-theme/apolo"
          else
            git clone --depth 1 --branch "master" "https://github.com/neuro-inc/launchpad.git" /tmp/repo
            THEME_SRC="/tmp/repo/keycloak-theme/apolo"
          fi
          mkdir -p "/opt/keycloak/themes/apolo"
          cp -R "$THEME_SRC/." "/opt/keycloak/themes/apolo/"
          chown -R 1000:0 /opt/keycloak/themes
      volumeMounts:
        - name: empty-dir
          mountPath: /opt/keycloak/themes
          subPath: app-themes-dir
      env:
        - name: APOLO_APP_GIT_REPO
          value: ""
        - name: APOLO_APP_GIT_REVISION
          value: ""
      securityContext:
        runAsUser: 0
