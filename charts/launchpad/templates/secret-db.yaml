{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dbSecretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  DB_HOST: "{{ .Values.postgresql.fullnameOverride }}"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_NAME: "postgres"
  DB_PASSWORD: {{ required "Set dbPassword for the shared PostgreSQL service." .Values.dbPassword | quote }}
{{- end }}
