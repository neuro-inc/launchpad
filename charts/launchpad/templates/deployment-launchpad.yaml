{{- $dbHost := .Values.postgresql.fullnameOverride -}}
{{- $dbSecret := .Values.dbSecretName -}}
{{- $dbUser := "postgres" -}}
{{- if .Values.isolatedDatabases.enabled -}}
{{- $dbHost = .Values.isolatedDatabases.names.launchpad -}}
{{- $dbSecret = printf "%s-secret" $dbHost -}}
{{- $dbUser = "launchpad" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "launchpad.name" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "launchpad.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "launchpad.selectorLabels" . | nindent 8 }}
        {{- include "launchpad.apoloPodLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      imagePullSecrets:
        - name: "ghcr"
      containers:
        - name: launchpad
          image: {{ include "launchpad.image" . | quote }}
          imagePullPolicy: Always
          command:
            - "python"
            - "-m"
            - "launchpad"
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          ports:
            - containerPort: {{ .Values.port }}
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            {{- if or .Values.postgresql.enabled .Values.isolatedDatabases.enabled }}
            - name: DB_HOST
              value: {{ $dbHost }}
            - name: DB_USER
              value: {{ $dbUser | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: DB_PASSWORD
            - name: DB_NAME
              value: "launchpad"
            {{- else }}
            {{- $externalSecret := required "Set externalDatabase.existingSecret." .Values.externalDatabase.existingSecret }}
            {{- range $key := list "DB_HOST" "DB_PORT" "DB_USER" "DB_PASSWORD" "DB_NAME" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $externalSecret }}
                  key: {{ $key }}
            {{- end }}
            {{- end }}
            - name: KEYCLOAK_URL
              value: {{ include "keycloak.domain" . }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.defaultRealm }}
            - name: APOLO_PASSED_CONFIG
              value: {{ .Values.APOLO_PASSED_CONFIG | quote }}
            - name: LAUNCHPAD_INITIAL_CONFIG
              value: {{ .Values.LAUNCHPAD_INITIAL_CONFIG | quote }}
            - name: LAUNCHPAD_AUTH_BYPASS_PATH_PREFIXES
              value: {{ .Values.LAUNCHPAD_AUTH_BYPASS_PATH_PREFIXES | quote }}
            - name: SELF_DOMAIN
              value: {{ include "launchpad.apiDomain" . }}
            - name: WEB_DOMAIN
              value: {{ include "launchpad.domain" . }}
            - name: BASE_DOMAIN
              value: {{ .Values.domain }}
            - name: AUTH_MIDDLEWARE_NAME
              value: platform-{{ include "launchpad.name" . }}-auth-middleware
            - name: LAUNCHPAD_APP_ID
              value: {{ .Values.apolo_app_id | quote }}
            - name: LAUNCHPAD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "launchpad.admin-secret" . }}
                  key: LAUNCHPAD_ADMIN_PASSWORD
            {{- range $name, $value := .Values.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end}}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
