apiVersion: v1
kind: Service
metadata:
  name: {{ include "launchpad.name" . }}-client
  labels:
    {{- include "launchpad.labels" . | nindent 4 }}
    service: client
spec:
  {{- if .Values.frontend.image.digest }}
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "launchpad.name" . }}-client
  ports:
    - port: 80
      targetPort: http
      name: http
  {{- else }}
  ports:
    - protocol: TCP
      port: 443
      targetPort: 443
      name: https
  type: ExternalName
  sessionAffinity: None
  externalName: {{ .Values.netlifyDomain }}
  {{- end }}
