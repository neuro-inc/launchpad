{{- if .Values.frontend.image.digest }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.frontend.image.digest) }}
{{- fail "frontend.image.digest must be an immutable SHA-256 image digest." }}
{{- end }}
{{- if lt (len .Values.frontend.sessionSecret) 32 }}
{{- fail "frontend.sessionSecret must contain at least 32 characters." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "launchpad.name" . }}-frontend-session
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  NEXTAUTH_SECRET: {{ .Values.frontend.sessionSecret | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "launchpad.name" . }}-client
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "launchpad.name" . }}-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "launchpad.name" . }}-client
        {{- include "launchpad.apoloPodLabels" . | nindent 8 }}
        platform.apolo.us/app-id: {{ .Values.apolo_app_id | quote }}
      annotations:
        checksum/session: {{ .Values.frontend.sessionSecret | sha256sum }}
    spec:
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}@{{ .Values.frontend.image.digest }}"
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXTAUTH_URL
              value: {{ include "launchpad.domainWithProtocol" . | quote }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "launchpad.name" . }}-frontend-session
                  key: NEXTAUTH_SECRET
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
{{- end }}
