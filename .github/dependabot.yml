version: 2
registries:
  fontawesome:
    type: npm-registry
    url: https://npm.fontawesome.com
    token: ${{secrets.FONTAWESOME_NPM_AUTH_TOKEN}}
updates:
- package-ecosystem: pip
  allow:
    - dependency-type: all
  directory: /
  schedule:
    interval: daily
    time: "03:00"
  open-pull-requests-limit: 10
  insecure-external-code-execution: allow
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
    time: "03:00"
  open-pull-requests-limit: 10
- package-ecosystem: npm
  directory: /frontend
  schedule:
    interval: weekly
  registries:
    - fontawesome
  open-pull-requests-limit: 10
