name: Frontend validation

on:
  workflow_call:
  schedule:
    - cron: 0 6 * * *

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Require a trusted branch for private dependencies
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Private frontend dependencies require a maintainer branch in this repository. Create a replacement PR from that branch."
          exit 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
      - name: Run frontend linting
        run: npm run lint
        env:
          CI: true
      - name: Validate the production build
        run: npm run build
        env:
          NEXT_PUBLIC_ENVIRONMENT: production
