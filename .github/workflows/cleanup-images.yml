name: Clean temporary CI images

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete expired CI images after protecting published image graphs
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: launchpad-registry
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Collect protected Launchpad image digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/protected_images.py "$RUNNER_TEMP/launchpad-protected-digests.json"
      - uses: neuro-inc/reuse/.github/actions/cleanup-ghcr-images@266b7b63221b2d58fe3b40c787e0c6c45cd303f4
        with:
          protected-digests-file: ${{ runner.temp }}/launchpad-protected-digests.json
          temporary-tag-pattern: 'ci-[0-9a-f]{40}'
          retention-days: '90'
          apply: ${{ github.event_name == 'schedule' || inputs.apply }}
