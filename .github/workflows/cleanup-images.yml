name: Clean temporary CI images

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete expired CI images after protecting published image graphs
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: launchpad-registry
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Inspect or delete expired CI images
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          args=()
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python3 .github/scripts/cleanup_images.py "${args[@]}"
