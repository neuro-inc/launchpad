name: Verify production App promotion

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful master CI release run
        required: true
        type: number

permissions:
  contents: read
  actions: read

jobs:
  promote:
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the complete development release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          DEV_LAUNCHPAD_ARGO_APPLICATION: ${{ vars.DEV_LAUNCHPAD_ARGO_APPLICATION }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_READ_TOKEN }}
        run: |
          gh run view "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headBranch,event,workflowName --jq \
            'if .conclusion == "success" and .headBranch == "master" and (.event == "push" or .event == "workflow_dispatch") and .workflowName == "CI" then . else error("A successful master release is required.") end'
          python3 .github/scripts/release.py download "$RUNNER_TEMP/app-release" --run-id "$BUILD_RUN_ID"
          expected_revision=$(gh run view "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          python3 .github/scripts/release.py promote "$RUNNER_TEMP/app-release" --revision "$expected_revision"
      - uses: actions/upload-artifact@v4
        with:
          name: launchpad-production-release
          path: ${{ runner.temp }}/app-release/
          overwrite: true
          if-no-files-found: error
          retention-days: 90
