name: PR linting

on:
  push:
    branches:
      - main

  pull_request:

  schedule:
    - cron: 0 6 * * * # Daily 6AM UTC build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linting
        run: yarn lint
        env:
          CI: true
