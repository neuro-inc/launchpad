name: PR linting

on:
  push:
    branches:
      - development

  pull_request:

  schedule:
    - cron: 0 6 * * * # Daily 6AM UTC build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint
        env:
          CI: true
