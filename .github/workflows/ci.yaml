name: CI

on:
  workflow_dispatch:
    inputs:
      rebuild_images:
        description: Rebuild all images and refresh base images on master
        type: boolean
        default: false
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: launchpad-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:

  frontend-test:
    name: Frontend checks
    uses: ./.github/workflows/frontend-validation.yml
    secrets:
      FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run format checks
        run: make format
        env:
          CI: true

      - name: Run linting
        run: make lint

      - name: Run unit tests
        run: make test-unit

      - name: Run integration tests
        run: make test-integration
        env:
          # Configure testcontainers for CI environment
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: false

      - name: Upload unit test coverage
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: .coverage.unit.xml
          flags: unit
          name: unit-tests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload integration test coverage
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: .coverage.integration.xml
          flags: integration
          name: integration-tests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  approve:
    name: Approve bot PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && endsWith(github.actor, '[bot]')
    needs: [test, hook-test, frontend-test, release-test]
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: metadata
      id: metadata
      if: github.actor == 'dependabot[bot]'
      uses: dependabot/fetch-metadata@v3
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Enable auto-merge for bot PRs
      run: gh pr merge --auto --squash --delete-branch "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-test:
    name: Release validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install mypy==1.18.2
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Verify release checks in a tag dispatch context
        run: GITHUB_REF_TYPE=tag GITHUB_REF_NAME=v0.0.0 GITHUB_EVENT_NAME=workflow_dispatch make test-release
      - run: make lint-release

  hook-test:
    name: Hook checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      - uses: actions/cache@v6
        id: dependencies
        with:
          path: hooks/.venv
          key: hooks-venv-${{ runner.os }}-${{ hashFiles('hooks/poetry.lock') }}
      - name: Install hook dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: cd hooks && poetry install --no-interaction --no-root
      - name: Install hook project
        run: cd hooks && poetry install --no-interaction
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - run: make test-hooks
      - uses: codecov/codecov-action@v7
        if: always()
        with:
          files: hooks/.coverage.hooks.xml
          flags: hooks
          name: hooks-tests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  release-plan:
    name: Verify the reuse base
    needs: release-test
    if: >-
      ${{ github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
          (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' &&
           github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the successful master reuse base
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_IMAGES: ${{ inputs.rebuild_images || false }}
        run: python3 .github/scripts/release.py prepare "$RUNNER_TEMP/release-base"
      - uses: actions/upload-artifact@v4
        with:
          name: launchpad-reuse-base
          path: ${{ runner.temp }}/release-base/
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  backend-image:
    name: Backend image
    needs: [release-plan, test]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/component-image.yml
    with:
      component: backend
      rebuild_images: ${{ inputs.rebuild_images || false }}

  frontend-image:
    name: Frontend image
    needs: [release-plan, frontend-test]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/component-image.yml
    secrets:
      FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
    with:
      component: frontend
      rebuild_images: ${{ inputs.rebuild_images || false }}

  hook-image:
    name: Hook image
    needs: [release-plan, hook-test, backend-image, frontend-image]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/component-image.yml
    with:
      component: hook
      backend_ref: ${{ needs.backend-image.outputs.image_ref }}
      frontend_ref: ${{ needs.frontend-image.outputs.image_ref }}
      rebuild_images: ${{ inputs.rebuild_images || false }}

  release-combination:
    name: Record the tested App release combination
    runs-on: ubuntu-latest
    needs: [release-plan, test, hook-test, frontend-test, release-test, backend-image, frontend-image, hook-image]
    if: ${{ !cancelled() && needs.release-plan.result == 'success' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every check and image selection to succeed
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$REQUIRED_JOBS"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - uses: actions/download-artifact@v4
        with:
          pattern: launchpad-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/component-images
      - name: Verify and assemble the release
        run: >-
          python3 .github/scripts/release.py assemble "$RUNNER_TEMP/launchpad-release"
          --images "$RUNNER_TEMP/component-images"
      - uses: actions/upload-artifact@v4
        with:
          name: launchpad-release
          path: ${{ runner.temp }}/launchpad-release/
          overwrite: true
          if-no-files-found: error
          retention-days: 90

  pr-image-comment:
    name: Record the PR backend image
    needs: backend-image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        env:
          IMAGE_REF: ${{ needs.backend-image.outputs.image_ref }}
        uses: actions/github-script@v9
        with:
          script: |
            const commentBody = `🐳 Docker image for this PR has been built and pushed:\n\n\`${process.env.IMAGE_REF}\``;

            // Get all comments on the PR
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Check if bot already commented
            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Docker image for this PR has been built')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            }
