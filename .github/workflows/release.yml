name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful master CI run tested in development
        required: true
        type: string
      release_tag:
        description: Existing reviewed version tag to publish
        required: true
        type: string

concurrency:
  group: launchpad-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  release:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the development-tested App combination
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: >-
          python3 .github/scripts/release.py publish "$RUNNER_TEMP/launchpad-release"
          --run-id "$BUILD_RUN_ID" --release-tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: launchpad-release
          path: ${{ runner.temp }}/launchpad-release/
          overwrite: true
          if-no-files-found: error
          retention-days: 90
