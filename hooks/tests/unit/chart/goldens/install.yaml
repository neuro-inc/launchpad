apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: launchpad-golden-app-kc-db
spec:
  serviceName: launchpad-golden-app-kc-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: launchpad-golden-app-kc-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: launchpad-golden-app-kc-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: platform.neuromation.io/job
                operator: In
                values:
                - "true"
      tolerations:
        - effect: NoSchedule
          key: platform.neuromation.io/job
          operator: Exists
        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
          tolerationSeconds: 300
        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
          tolerationSeconds: 300
      containers:
        - name: postgres
          image: "docker.io/library/postgres:17.12-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command: ["/bin/bash", "-euc"]
          args:
            - |
              # The official entrypoint requires a bootstrap password. Init removes it before TCP starts.
              export POSTGRES_PASSWORD="$(head -c 32 /dev/urandom | base64)"
              exec docker-entrypoint.sh postgres
          envFrom:
            - secretRef:
                name: launchpad-golden-app-kc-db-secret
          env:
            - name: POSTGRES_DB
              value: "keycloak"
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-local=peer --auth-host=scram-sha-256"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - PGPASSWORD="$DB_PASSWORD" psql -Xw -h 127.0.0.1 -U "$DB_USER" -d "$DB_NAME" -Atqc 'SELECT 1'
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: launchpad-golden-app-postgresql-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: "8Gi"
